<li class="crm-summary-item" style="list-style: none; margin-bottom: 1.5rem; width: 100%;">
    <div style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: #ffffff; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.12); width: 100%;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.75rem;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <div>
                    <h3 style="margin: 0; font-size: 1.15rem; font-weight: 700; color: #f8fafc;">SmartFlow AI CRM & ERP Intelligence</h3>
                    <span style="font-size: 0.8rem; color: #94a3b8;">Hệ thống phân tích khách hàng & tự động hóa kinh doanh</span>
                </div>
            </div>
            <div>
                <form action="{% url 'crm_admin_generate_report' %}" method="POST" style="margin: 0;">
                    {% csrf_token %}
                    <button type="submit" style="background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.4rem;">
                        <span>Sinh Báo cáo AI ngay</span>
                    </button>
                </form>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-top: 1rem;">
            <div style="background: rgba(255, 255, 255, 0.07); padding: 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
                <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; font-weight: 600;">Tổng Khách hàng</div>
                <div style="font-size: 1.75rem; font-weight: 800; color: #38bdf8; margin-top: 0.25rem;">{{ total_customers }}</div>
            </div>

            <div style="background: rgba(255, 255, 255, 0.07); padding: 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
                <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; font-weight: 600;">Leads Nóng (HOT)</div>
                <div style="font-size: 1.75rem; font-weight: 800; color: #f87171; margin-top: 0.25rem;">{{ hot_leads }}</div>
            </div>

            <div style="background: rgba(255, 255, 255, 0.07); padding: 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);">
                <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; font-weight: 600;">Doanh số thực tế</div>
                <div style="font-size: 1.5rem; font-weight: 800; color: #4ade80; margin-top: 0.25rem;">{{ won_revenue|floatformat:0 }} đ</div>
            </div>

            <div style="background: rgba(255, 255, 255, 0.07); padding: 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; justify-content: center;">
                <a href="/" target="_blank" style="color: #cbd5e1; text-decoration: none; font-size: 0.85rem; display: flex; align-items: center; justify-content: space-between; font-weight: 600;">
                    <span>Mở Sales Dashboard Web</span>
                    <span>→</span>
                </a>
            </div>
        </div>
    </div>
</li>
